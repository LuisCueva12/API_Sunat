openapi: 3.1.0
info:
  title: API de Facturación Electrónica
  version: 1.0.0
  description: Emisión y consulta multiempresa de comprobantes electrónicos SUNAT.
servers:
  - url: /api/v1
security:
  - oauth2: [comprobantes:leer]
tags:
  - name: Emisión
  - name: Comprobantes
  - name: Empresa
paths:
  /facturas:
    post:
      tags: [Emisión]
      summary: Emitir una factura
      security:
        - oauth2: [comprobantes:crear]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmisionFactura'
      responses:
        '202':
          $ref: '#/components/responses/ComprobanteCreado'
        '422':
          $ref: '#/components/responses/ErrorValidacion'
  /boletas:
    post:
      tags: [Emisión]
      summary: Emitir una boleta
      security:
        - oauth2: [comprobantes:crear]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmisionBoleta'
      responses:
        '202':
          $ref: '#/components/responses/ComprobanteCreado'
        '422':
          $ref: '#/components/responses/ErrorValidacion'
  /notas-credito:
    post:
      tags: [Emisión]
      summary: Emitir una nota de crédito
      security:
        - oauth2: [comprobantes:crear]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmisionNota'
      responses:
        '202':
          $ref: '#/components/responses/ComprobanteCreado'
        '422':
          $ref: '#/components/responses/ErrorValidacion'
  /notas-debito:
    post:
      tags: [Emisión]
      summary: Emitir una nota de débito
      security:
        - oauth2: [comprobantes:crear]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmisionNota'
      responses:
        '202':
          $ref: '#/components/responses/ComprobanteCreado'
        '422':
          $ref: '#/components/responses/ErrorValidacion'
  /comprobantes:
    get:
      tags: [Comprobantes]
      summary: Listar comprobantes de la empresa autenticada
      parameters:
        - {name: tipo, in: query, schema: {type: string}}
        - {name: estado, in: query, schema: {type: string}}
        - {name: serie, in: query, schema: {type: string}}
        - {name: fecha_desde, in: query, schema: {type: string, format: date}}
        - {name: fecha_hasta, in: query, schema: {type: string, format: date}}
        - {name: por_pagina, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
      responses:
        '200':
          description: Listado paginado
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/RespuestaBase'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: {$ref: '#/components/schemas/ComprobanteResumen'}
  /comprobantes/{id}:
    get:
      tags: [Comprobantes]
      summary: Obtener el detalle completo
      parameters:
        - $ref: '#/components/parameters/ComprobanteId'
      responses:
        '200':
          description: Detalle del comprobante
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/RespuestaBase'
                  - type: object
                    properties:
                      data: {$ref: '#/components/schemas/ComprobanteDetalle'}
        '404': {$ref: '#/components/responses/NoEncontrado'}
  /comprobantes/{id}/estado:
    get:
      tags: [Comprobantes]
      summary: Consultar el estado actual
      parameters:
        - $ref: '#/components/parameters/ComprobanteId'
      responses:
        '200':
          description: Estado actual
        '404': {$ref: '#/components/responses/NoEncontrado'}
  /comprobantes/{id}/eventos:
    get:
      tags: [Comprobantes]
      summary: Consultar la trazabilidad del comprobante
      parameters:
        - $ref: '#/components/parameters/ComprobanteId'
      responses:
        '200':
          description: Eventos ordenados del más reciente al más antiguo
        '404': {$ref: '#/components/responses/NoEncontrado'}
  /comprobantes/{id}/reintentar:
    post:
      tags: [Comprobantes]
      summary: Reintentar un comprobante en ERROR
      security:
        - oauth2: [comprobantes:reintentar]
      parameters:
        - $ref: '#/components/parameters/ComprobanteId'
      responses:
        '202':
          description: Reintento programado
        '409':
          description: El comprobante no está en ERROR
  /comprobantes/{id}/xml:
    get:
      tags: [Comprobantes]
      summary: Descargar el XML firmado
      parameters:
        - $ref: '#/components/parameters/ComprobanteId'
      responses:
        '200':
          description: XML firmado
          content:
            application/xml:
              schema: {type: string}
        '404': {$ref: '#/components/responses/NoEncontrado'}
  /comprobantes/{id}/cdr:
    get:
      tags: [Comprobantes]
      summary: Descargar el CDR ZIP
      parameters:
        - $ref: '#/components/parameters/ComprobanteId'
      responses:
        '200':
          description: CDR de SUNAT
          content:
            application/zip:
              schema: {type: string, format: binary}
        '404': {$ref: '#/components/responses/NoEncontrado'}
  /comprobantes/{id}/pdf:
    get:
      tags: [Comprobantes]
      summary: Descargar el ticket PDF de un comprobante aceptado
      parameters:
        - $ref: '#/components/parameters/ComprobanteId'
      responses:
        '200':
          description: Ticket PDF
          content:
            application/pdf:
              schema: {type: string, format: binary}
        '404': {$ref: '#/components/responses/NoEncontrado'}
        '409':
          description: El comprobante aún no fue aceptado
  /empresas/actual:
    get:
      tags: [Empresa]
      summary: Obtener la empresa de la integración autenticada
      responses:
        '200':
          description: Empresa actual
components:
  securitySchemes:
    oauth2:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: /oauth/token
          scopes:
            comprobantes:crear: Emitir comprobantes
            comprobantes:leer: Consultar y descargar comprobantes
            comprobantes:reintentar: Reintentar comprobantes con error
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema: {type: string, minLength: 1, maxLength: 255}
    ComprobanteId:
      name: id
      in: path
      required: true
      schema: {type: string, format: uuid}
  schemas:
    ItemEntrada:
      type: object
      required: [descripcion, unidad_medida, cantidad, valor_unitario, tipo_afectacion_igv]
      properties:
        codigo_producto: {type: [string, 'null'], maxLength: 50}
        descripcion: {type: string, maxLength: 500}
        unidad_medida: {type: string, maxLength: 3, example: NIU}
        cantidad: {type: number, exclusiveMinimum: 0}
        valor_unitario: {type: string, pattern: '^\d+(\.\d{1,2})?$', example: '100.00'}
        tipo_afectacion_igv: {type: string, enum: ['10']}
        descuento: {type: [string, 'null'], pattern: '^\d+(\.\d{1,2})?$'}
    EmisionBase:
      type: object
      required: [serie, receptor_tipo_documento, items]
      properties:
        serie: {type: string, maxLength: 4}
        receptor_tipo_documento: {type: string}
        receptor_numero_documento: {type: string, maxLength: 15}
        receptor_razon_social: {type: [string, 'null'], maxLength: 255}
        moneda: {type: string, enum: [PEN, USD], default: PEN}
        items:
          type: array
          minItems: 1
          items: {$ref: '#/components/schemas/ItemEntrada'}
    EmisionFactura:
      allOf:
        - $ref: '#/components/schemas/EmisionBase'
        - type: object
          properties:
            receptor_tipo_documento: {const: '6'}
          required: [receptor_numero_documento]
    EmisionBoleta:
      allOf:
        - $ref: '#/components/schemas/EmisionBase'
    EmisionNota:
      allOf:
        - $ref: '#/components/schemas/EmisionBase'
        - type: object
          required: [comprobante_referencia_id, codigo_motivo, descripcion_motivo]
          properties:
            comprobante_referencia_id: {type: string, format: uuid}
            codigo_motivo: {type: string}
            descripcion_motivo: {type: string, maxLength: 255}
    ComprobanteResumen:
      type: object
      required: [id, tipo, serie, numero, estado, receptor, moneda, total, fecha_emision, creado_en]
      properties:
        id: {type: string, format: uuid}
        tipo: {type: string, enum: [factura, boleta, nota_credito, nota_debito]}
        serie: {type: string}
        numero: {type: integer}
        estado: {type: string}
        receptor: {type: object}
        moneda: {type: string}
        total: {type: string}
        fecha_emision: {type: string, format: date}
        creado_en: {type: string, format: date-time}
    ComprobanteCreadoData:
      type: object
      required: [id, tipo, serie, numero, estado]
      properties:
        id: {type: string, format: uuid}
        tipo: {type: string, enum: [factura, boleta, nota_credito, nota_debito]}
        serie: {type: string}
        numero: {type: integer}
        estado: {type: string, const: REGISTRADO}
    ComprobanteDetalle:
      allOf:
        - $ref: '#/components/schemas/ComprobanteResumen'
        - type: object
          properties:
            totales: {type: object}
            referencia: {type: [object, 'null']}
            items: {type: array, items: {type: object}}
            tributos: {type: array, items: {type: object}}
            procesamiento: {type: object}
    RespuestaBase:
      type: object
      required: [data, meta]
      properties:
        data: {}
        meta:
          type: object
          required: [request_id]
          properties:
            request_id: {type: string}
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [codigo, mensaje, detalles]
          properties:
            codigo: {type: string}
            mensaje: {type: string}
            detalles: {type: array, items: {type: object}}
  responses:
    ComprobanteCreado:
      description: Comprobante registrado y procesamiento encolado
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/RespuestaBase'
              - type: object
                properties:
                  data: {$ref: '#/components/schemas/ComprobanteCreadoData'}
    ErrorValidacion:
      description: Datos inválidos
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    NoEncontrado:
      description: El recurso no existe o pertenece a otra empresa
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
